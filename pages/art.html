<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anime & Landscapes Art Studio</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="app-header">
        <div class="logo-area">
            <h1>🌸 Anime & Art Studio</h1>
            <span class="sub-logo">Studio Ghibli & Cyberpunk Edition</span>
        </div>
        <div class="actions-area">
            <button class="btn-action" id="btnUndo" title="Deshacer">↩️</button>
            <button class="btn-action" id="btnClear">🗑️ Limpiar</button>
            <button class="btn-action primary" id="btnSave">💾 Descargar Obra</button>
        </div>
    </header>

    <main class="workspace">
        <!-- Selector de Plantillas (Anime / Paisajes) -->
        <section class="templates-sidebar">
            <h3>✨ Plantillas</h3>
            <div class="thumb-list">
                <button class="thumb-btn active" data-template="chibi">Chibi Anime 🐾</button>
                <button class="thumb-btn" data-template="paisaje">Paisaje Estrellado 🌌</button>
                <button class="thumb-btn" data-template="cyberpunk">Cyber City 🏙️</button>
                <button class="thumb-btn" data-template="blanco">Lienzo Libre 🎨</button>
            </div>
        </section>

        <!-- Lienzo de Dibujo/Coloreo -->
        <div class="canvas-wrapper">
            <canvas id="artCanvas"></canvas>
        </div>
    </main>

    <footer class="toolbar">
        <!-- Herramientas -->
        <div class="tools-group">
            <button class="tool-btn active" data-tool="pincel">✏️ Pincel</button>
            <button class="tool-btn" data-tool="neon">✨ Neón Glow</button>
            <button class="tool-btn" data-tool="relleno">🪣 Cubeta</button>
            <button class="tool-btn" data-tool="borrador">🧹 Borrador</button>
        </div>

        <!-- Tamaños y Grosores -->
        <div class="size-group">
            <span>Grosor:</span>
            <input type="range" id="brushSize" min="2" max="50" value="12">
        </div>

        <!-- Paleta de Colores Estilo Anime / Pastel -->
        <div class="palette-container" id="colorPalette"></div>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
